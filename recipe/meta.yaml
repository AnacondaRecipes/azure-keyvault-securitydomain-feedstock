{% set name = "azure-keyvault-securitydomain" %}
{% set version = "1.0.0b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 3291a191e778a947e4b28ed01327892a93aedcf8e0a0dd674cf116cb11043776

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - isodate >=0.6.1
    - azure-core >=1.31.0
    - typing_extensions >=4.6.0

test:
  imports:
    - azure.keyvault.securitydomain
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk
  summary: Microsoft Corporation Azure Keyvault Securitydomain Client Library for Python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: Azure Key Vault Security Domain client library for Python
  dev_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk
  doc_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk

extra:
  recipe-maintainers:
    - janjagusch
